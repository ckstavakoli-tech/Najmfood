
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#54280f">
<title>Najm Food | نجم فود</title>
<meta name="description" content="راه‌های ارتباط با نجم‌فود در شبکه‌های اجتماعی">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #351909;
}

body {
  font-family: Tahoma, Arial, sans-serif;
}

.poster-wrap {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  line-height: 0;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
}

.link {
  position: absolute;
  display: block;
  border-radius: 7%;
  -webkit-tap-highlight-color: transparent;
}

.link:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

/* محدوده کلیک کارت تلگرام */
.telegram {
  left: 14.5%;
  top: 44.3%;
  width: 34.5%;
  height: 17.6%;
}

/* محدوده کلیک کارت اینستاگرام */
.instagram {
  left: 50.7%;
  top: 44.3%;
  width: 34.5%;
  height: 17.6%;
}

/* محدوده کلیک کارت ایتا */
.eitaa {
  left: 14.5%;
  top: 62.7%;
  width: 34.5%;
  height: 17.8%;
}

/* محدوده کلیک کارت بله */
.bale {
  left: 50.7%;
  top: 62.7%;
  width: 34.5%;
  height: 17.8%;
}

@media (min-width: 601px) {
  body {
    padding: 18px 0;
  }

  .poster-wrap {
    box-shadow: 0 12px 45px #0008;
  }
}
</style>
</head>

<body>
<main class="poster-wrap" aria-label="نجم فود">

  <!-- تصویر اصلی طرح جدید -->
  <img
    class="poster"
    src="najmfood-poster.png"
    alt="نجم فود؛ عطر غذای خانگی"
  >

  <!-- تلگرام -->
  <a
    class="link telegram"
    href="intent://resolve?domain=najmfood#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=https%3A%2F%2Ft.me%2Fnajmfood;end"
    aria-label="تلگرام نجم فود"
  ></a>

  <!-- اینستاگرام -->
  <a
    class="link instagram"
    href="https://instagram.com/najmfood"
    aria-label="اینستاگرام نجم فود"
  ></a>

  <!-- ایتا -->
  <a
    class="link eitaa"
    href="intent://eitaa.com/najmfood#Intent;scheme=https;package=ir.eitaa.messenger;S.browser_fallback_url=https%3A%2F%2Feitaa.com%2Fnajmfood;end"
    aria-label="ایتا نجم فود"
  ></a>

  <!-- بله -->
  <a
    class="link bale"
    href="https://ble.ir/najmfood"
    aria-label="بله نجم فود"
  ></a>

</main>
</body>
</html>
