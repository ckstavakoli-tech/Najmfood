
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#351909">
<title>Najm Food | نجم فود</title>
<meta name="description" content="شبکه‌های اجتماعی نجم فود">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#351909;
  font-family:Tahoma,Arial,sans-serif;
}

body{overflow-x:hidden}

.poster-wrap{
  position:relative;
  width:100%;
  height:100vh;
  height:100svh;
  min-height:540px;
  overflow:hidden;
  margin:0 auto;
}

.poster{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
}

/* محدوده کلیک کارت‌ها */
.link{
  position:absolute;
  display:block;
  border-radius:8%;
  -webkit-tap-highlight-color:transparent;
  z-index:2;
}

.link:focus-visible{
  outline:3px solid white;
  outline-offset:3px;
}

/* تلگرام */
.telegram{
  left:5%;
  top:44.3%;
  width:43.5%;
  height:17.6%;
}

/* اینستاگرام */
.instagram{
  left:50.8%;
  top:44.3%;
  width:43.5%;
  height:17.6%;
}

/* ایتا */
.eitaa{
  left:5%;
  top:62.7%;
  width:43.5%;
  height:17.8%;
}

/* بله */
.bale{
  left:50.8%;
  top:62.7%;
  width:43.5%;
  height:17.8%;
}

/* پیام راهنما */
.install-note{
  position:absolute;
  z-index:3;
  top:81.2%;
  left:5%;
  width:90%;
  padding:10px 12px;
  border:1px solid rgba(255,220,155,.8);
  border-radius:16px;
  background:rgba(48,22,8,.78);
  color:#fff4df;
  text-align:center;
  font-size:clamp(11px,2.8vw,14px);
  font-weight:bold;
  line-height:1.9;
  text-shadow:0 1px 3px #321708;
  box-shadow:0 4px 16px #0003;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  pointer-events:none;
}

@media(max-height:700px){
  .install-note{
    padding:6px 8px;
    font-size:11px;
  }
}

@media(min-width:600px){
  .poster-wrap{
    max-width:600px;
    box-shadow:0 0 35px #0008;
  }
}
</style>
</head>

<body>
<main class="poster-wrap" aria-label="شبکه‌های اجتماعی نجم فود">

  <img
    class="poster"
    src="najmfood-poster.png"
    alt="نجم فود؛ عطر غذای خانگی"
  >

  <a
    class="link telegram"
    href="intent://resolve?domain=najmfood#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=https%3A%2F%2Ft.me%2Fnajmfood;end"
    aria-label="ورود به تلگرام نجم فود"
  ></a>

  <a
    class="link instagram"
    href="https://instagram.com/najmfood"
    aria-label="ورود به اینستاگرام نجم فود"
  ></a>

  <a
    class="link eitaa"
    href="intent://eitaa.com/najmfood#Intent;scheme=https;package=ir.eitaa.messenger;S.browser_fallback_url=https%3A%2F%2Feitaa.com%2Fnajmfood;end"
    aria-label="ورود به ایتا نجم فود"
  ></a>

  <a
    class="link bale"
    href="https://ble.ir/najmfood"
    aria-label="ورود به بله نجم فود"
  ></a>

  <div class="install-note">
    ✨ برای ورود به هر شبکه اجتماعی، باید برنامه مربوطه بر روی گوشی نصب باشد.
  </div>

</main>
</body>
</html>
